<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <title>NexusAR Strike · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        background: radial-gradient(circle at 20% -10%, rgba(56, 189, 248, 0.16), transparent 55%), #04070d;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, monospace;
        letter-spacing: 0.3em;
        font-size: 11px;
        color: #38bdf8;
      }
      h1 { font-size: 1.75rem; margin: 0.5rem 0; letter-spacing: -0.02em; }
      p { color: #94a3b8; font-size: 0.85rem; line-height: 1.6; max-width: 22rem; }
      button {
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.8rem 1.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        font-weight: 700;
        color: #030712;
        background: linear-gradient(90deg, #0ea5e9, #22d3ee);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mono">NEXUSAR STRIKE</p>
      <h1>Offline</h1>
      <p>
        The app shell is cached on this device. Reconnect to the squad hotspot (or any network) to
        sync live match telemetry — the AR view and minimap need the host link.
      </p>
      <button onclick="location.replace('/')">RETRY LINK</button>
    </main>
  </body>
</html>
